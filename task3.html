<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3 - Fixed Cafe Reservation Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light py-5">

    <main class="container col-12 col-md-8 col-lg-6">
        <div class="card shadow-sm p-4">
            <h2 class="mb-4 text-center fw-bold">Reserve a table</h2>
            
            <form action="#" method="POST">
                
                <div class="mb-3">
                    <label for="userName" class="form-label">Your name</label>
                    <input type="text" class="form-control" id="userName" name="userName" placeholder="Your name" required>
                </div>

                <div class="mb-3">
                    <label for="userEmail" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="userEmail" name="userEmail" placeholder="name@example.com" required>
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label">Phone</label>
                    <input type="tel" class="form-control" id="phone" name="phone" placeholder="+7 701 234 56 78" required>
                </div>

                <div class="mb-3">
                    <label for="people" class="form-label">Number of Guests</label>
                    <input type="number" class="form-control" id="people" name="people" min="1" max="20" placeholder="Number of guests" required>
                </div>

                <div class="mb-3">
                    <label for="resDate" class="form-label">Date</label>
                    <input type="date" class="form-control" id="resDate" name="resDate" required>
                </div>

                <div class="mb-3">
                    <label for="mealType" class="form-label">Meal Option</label>
                    <select class="form-select" id="mealType" name="mealType" required>
                        <option value="" selected disabled>Select meal time...</option>
                        <option value="lunch">Lunch</option>
                        <option value="dinner">Dinner</option>
                    </select>
                </div>

                <fieldset class="mb-3">
                    <legend class="form-label fs-6">Seating Location</legend>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="seating" id="seatingInside" value="inside" checked required>
                        <label class="form-check-label" for="seatingInside">Inside</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="seating" id="seatingTerrace" value="terrace" required>
                        <label class="form-check-label" for="seatingTerrace">Terrace</label>
                    </div>
                </fieldset>

                <div class="mb-3">
                    <label for="comments" class="form-label">Special Comments</label>
                    <textarea class="form-control" id="comments" name="comments" rows="3" placeholder="Any special requests?"></textarea>
                </div>

                <div class="mb-4 form-check">
                    <input type="checkbox" class="form-check-input" id="agreeTerms" name="agreeTerms" required>
                    <label class="form-check-label" for="agreeTerms">I agree to the terms and conditions</label>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Reserve</button>
            </form>
        </div>
    </main>

</body>
</html>
