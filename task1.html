<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 1 - Book a Train Ticket</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="task1-body d-flex align-items-center justify-content-center min-vh-100 py-4">

    <div class="train-card card border-0 shadow-lg p-3 p-md-4">
        <div class="train-header text-white rounded-3 p-3 mb-4">
            <h2 class="h4 m-0 fw-bold">Book a train ticket</h2>
        </div>

        <form action="#" method="GET">
            <div class="mb-4">
                <div class="trip-type-toggle d-inline-flex p-1 rounded-pill bg-light border">
                    <input type="radio" class="btn-check" name="tripType" id="oneWay" value="oneWay" checked>
                    <label class="btn btn-trip-type rounded-pill px-4 py-2" for="oneWay">One way</label>

                    <input type="radio" class="btn-check" name="tripType" id="roundTrip" value="roundTrip">
                    <label class="btn btn-trip-type rounded-pill px-4 py-2" for="roundTrip">Round trip</label>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-12 col-md-6">
                    <label for="fromCity" class="form-label text-muted small mb-1">From</label>
                    <input type="text" id="fromCity" class="form-control form-control-lg custom-input" value="Astana" required>
                </div>
                <div class="col-12 col-md-6">
                    <label for="toCity" class="form-label text-muted small mb-1">To</label>
                    <input type="text" id="toCity" class="form-control form-control-lg custom-input" value="Almaty" required>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-12 col-md-4">
                    <label for="deptDate" class="form-label text-muted small mb-1">Departure</label>
                    <input type="date" id="deptDate" class="form-control form-control-lg custom-input" required>
                </div>
                <div class="col-12 col-md-4">
                    <label for="retDate" class="form-label text-muted small mb-1">Return</label>
                    <input type="date" id="retDate" class="form-control form-control-lg custom-input">
                </div>
                <div class="col-12 col-md-4">
                    <label for="passengers" class="form-label text-muted small mb-1">Passengers</label>
                    <select id="passengers" class="form-select form-select-lg custom-input">
                        <option value="1">1 adult</option>
                        <option value="2">2 adults</option>
                        <option value="3">3 adults</option>
                        <option value="4">4 adults</option>
                        <option value="5">5 adults</option>
                        <option value="6">6 adults</option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label text-muted small d-block mb-2">Carriage class</label>
                <div class="d-flex gap-4">
                    <div class="form-check">
                        <input class="form-check-input custom-radio" type="radio" name="carriageClass" id="seat" value="seat" required>
                        <label class="form-check-label" for="seat">Seat</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input custom-radio" type="radio" name="carriageClass" id="coupe" value="coupe" checked required>
                        <label class="form-check-label" for="coupe">Coupé</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input custom-radio" type="radio" name="carriageClass" id="sleeper" value="sleeper" required>
                        <label class="form-check-label" for="sleeper">Sleeper</label>
                    </div>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-12 col-md-6">
                    <label for="phoneInput" class="form-label text-muted small mb-1">Phone</label>
                    <div class="input-group input-group-lg">
                        <span class="input-group-text custom-input bg-light">+7</span>
                        <input type="tel" id="phoneInput" class="form-control custom-input" placeholder="701 234 56 78" required>
                    </div>
                </div>
                <div class="col-12 col-md-6">
                    <label for="emailInput" class="form-label text-muted small mb-1">Email</label>
                    <input type="email" id="emailInput" class="form-control form-control-lg custom-input" placeholder="name@example.com" required>
                </div>
            </div>

            <div class="mb-3 form-check form-switch">
                <input class="form-check-input custom-switch" type="checkbox" id="smsCheck">
                <label class="form-check-label small text-secondary" for="smsCheck">Also send the ticket by SMS</label>
            </div>
            <div class="mb-4 form-check">
                <input class="form-check-input custom-checkbox" type="checkbox" id="rulesCheck" required>
                <label class="form-check-label small text-secondary" for="rulesCheck">I agree with the carriage rules</label>
            </div>

            <div class="d-flex flex-column flex-md-row justify-content-md-end gap-2 pt-2">
                <button type="reset" class="btn btn-outline-clear rounded-pill px-4 py-2 order-2 order-md-1">Clear</button>
                <button type="submit" class="btn btn-find-trains rounded-pill px-4 py-2 order-1 order-md-2 fw-bold">Find trains</button>
            </div>
        </form>
    </div>

</body>
</html>
